
{% extends "login/base.html" %}

{% block title %}
    Выполните вход через Active Directory
{% endblock %}


{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0">Вход через Active Directory</h4>
                </div>

                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit" class="btn btn-primary w-100">
                            Войти
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
