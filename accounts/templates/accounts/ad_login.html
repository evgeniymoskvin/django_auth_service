{% extends "login/base.html" %}

{% block title %}
    Выполните вход через Active Directory
{% endblock %}


{% block content %}
    <div class="d-flex w-100 justify-content-center align-items-center d-flex flex-column mt-5">
        <div class="d-flex flex-column justify-content-center">
            <form method="post" class="d-flex flex-column justify-content-center" style="max-width: 500px">

                {% csrf_token %}
                <div class="d-flex text-24px-bold">Вход через Active Directory</div>
                <div class="form-floating d-flex mt-2">
                    {{ form.username }}
                    <label for="floatingInput">e-mail</label>
                </div>
                <div class="form-floating d-flex mt-2">
                    {{ form.password }}
                    <label for="floatingPassword">Пароль</label>
                </div>
                {{ form.errors }}
                <button class="button_blue mt-2" style="padding: 13px;" type="submit">Войти</button>
            </form>
        </div>

        <div class="mt-3 flex-column ">
            <a href="{% url 'login' %}" class="d-flex" style="text-decoration: none">
                <span class=" link_dot_decoration">Войти через Kerberos</span>
            </a>
            <a href="{% url 'local_login' %}" class="d-flex" style="text-decoration: none">
                <span class=" link_dot_decoration">Вход для администраторов</span>
            </a>
        </div>
    </div>

{% endblock %}
